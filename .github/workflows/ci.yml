# Revisa cada pull request y cada push a main: los mismos cuatro comandos que AGENTS.md pide
# antes de commitear, más el build de producción.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec oxfmt --check
      # Incluye la huella del bakeo de cada nudo: falla cuando un cambio altera cómo se ata un nudo.
      - run: pnpm test
      - run: pnpm build
