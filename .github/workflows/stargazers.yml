# Ata un nudo en la soga de estrellas por cada estrella nueva en GitHub: actualiza
# public/stargazers.json, vuelve a dibujar la soga del README (.github/stargazer-rope-<hash>.svg,
# con un nombre de archivo nuevo cada vez para que GitHub no muestre uno cacheado, enlazado desde
# README.md), despliega el sitio en Cloudflare Pages y commitea las tres cosas.
# Corre cuando alguien le da estrella al repo, y una vez por día para agarrar lo que se haya perdido
# algún evento de estrella.
# Necesita los secrets del repositorio CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID y
# PUSH_TOKEN (un token de acceso personal fine-grained del admin del repo, con Contents: read and
# write sobre este repo).
name: Stargazers

on:
  watch:
    types: [started]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Una corrida a la vez; las estrellas que caen en medio de una corrida encolan una sola corrida más
# que las levanta a todas.
concurrency:
  group: stargazers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rope:
    # Solo en el repo original, que tiene esos secrets y el sitio en Cloudflare; en este fork se
    # saltea en lugar de fallar todos los días.
    if: github.repository == 'behnamazimi/knots'
    runs-on: ubuntu-latest
    steps:
      # main solo acepta pull requests; un token del admin del repo (que puede saltearse la regla) puede pushear.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Fetch stargazers
        run: node tools/stargazers.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Any new knots?
        id: feed
        run: git diff --quiet public/stargazers.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.feed.outputs.changed
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - if: steps.feed.outputs.changed
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.feed.outputs.changed
        run: pnpm install --frozen-lockfile

      - if: steps.feed.outputs.changed
        name: Redraw the README rope
        run: node tools/readme-rope.mjs

      # Desplegar antes de commitear: si el push falla, la próxima corrida igual ve el cambio y
      # vuelve a desplegar.
      - if: steps.feed.outputs.changed
        name: Deploy
        run: pnpm deploy:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - if: steps.feed.outputs.changed
        name: Commit the feed and the rope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/stargazers.json .github README.md
          git commit -m "Atar los nudos de las últimas estrellas"
          git pull --rebase
          git push
