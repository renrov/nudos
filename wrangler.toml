# Proyecto de Cloudflare Pages. `pnpm deploy:pages` buildea y sube build/client a producción (rama
# main), `pnpm deploy:pages:preview` a una URL de preview. El dominio propio se conecta al proyecto
# en el dashboard de Cloudflare (y se pone como SITE_URL en src/app/shared/site.ts).
name = "knots-made-easy"
pages_build_output_dir = "./build/client"
compatibility_date = "2026-10-01"
