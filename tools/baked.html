<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <title>Vista superior del cálculo</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #1d1f22;
        color: #e8e6e1;
        font: 13px system-ui;
      }
      canvas {
        background: #d9c7a3;
        border-radius: 6px;
        display: block;
      }
      #bar {
        display: flex;
        gap: 8px;
        align-items: center;
        width: 760px;
        margin-top: 6px;
      }
      #s {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="title"></div>
    <canvas id="c"></canvas>
    <div id="bar"><input id="s" type="range" min="0" step="1" /><span id="t"></span></div>
    <script type="module">
      // Vista de arriba de tools/out/bake.json (de knot-dump.test.ts), con los tramos dibujados en orden de altura. Corré `pnpm baked` y abrí http://localhost:5178/baked.html; ?zoom para el medio de la mesa, ?box=x0,x1,z0,z1 para cualquier zona.
      const data = await (await fetch("out/bake.json?" + Date.now())).json();
      const { n, radius: R, frames, steps } = data;
      const counts = data.counts ?? [n]; // sogas una detrás de la otra
      const ropeOf = counts.flatMap((c, k) => Array(c).fill(k));
      const q = new URLSearchParams(location.search);
      // ?box=x0,x1,z0,z1 elige la zona que se muestra.
      const [X0, X1, Z0, Z1] = q.has("box")
        ? q.get("box").split(",").map(Number)
        : q.has("zoom")
          ? [-0.25, 0.25, -0.18, 0.25]
          : [-0.9, 1.25, -0.3, 0.35];
      const W = 760,
        SC = W / (X1 - X0),
        H = (Z1 - Z0) * SC;
      const c = document.getElementById("c"),
        ctx = c.getContext("2d"),
        dpr = devicePixelRatio;
      c.width = W * dpr;
      c.height = H * dpr;
      c.style.width = W + "px";
      ctx.scale(dpr, dpr);
      const s = document.getElementById("s");
      s.max = frames.length - 1;
      window.show = (t) => {
        s.value = Math.round(t * 10);
        draw();
      };
      function draw() {
        const f = frames[+s.value],
          t = +s.value / 10;
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(80,60,30,0.15)";
        ctx.fillStyle = "rgba(80,60,30,0.6)";
        ctx.font = "10px ui-monospace";
        for (let x = Math.ceil(X0 * 10) / 10; x < X1; x += 0.1) {
          const X = (x - X0) * SC;
          ctx.beginPath();
          ctx.moveTo(X, 0);
          ctx.lineTo(X, H);
          ctx.stroke();
          ctx.fillText(x.toFixed(2), X + 2, H - 3);
        }
        for (let z = Math.ceil(Z0 * 10) / 10; z < Z1; z += 0.1) {
          const Y = (z - Z0) * SC;
          ctx.beginPath();
          ctx.moveTo(0, Y);
          ctx.lineTo(W, Y);
          ctx.stroke();
          ctx.fillText(z.toFixed(2), 2, Y - 2);
        }
        // Tramos de soga en una franja de altura, la franja más baja primero: soga sobre soga queda por lo menos 2R más arriba.
        const level = (i) => Math.max(0, Math.floor((f[i * 3 + 1] + f[i * 3 + 4]) / 2 / R - 0.5));
        const runs = [];
        for (let i = 0; i < n - 1; i++) {
          if (ropeOf[i] !== ropeOf[i + 1]) continue;
          const q = level(i),
            r = runs[runs.length - 1];
          if (r && r.q === q && r.end === i) r.end = i + 1;
          else runs.push({ q, start: i, end: i + 1 });
        }
        runs.sort((a, b) => a.q - b.q);
        const w = 2 * R * SC;
        ctx.lineJoin = "round";
        ctx.lineCap = "butt";
        for (const r of runs) {
          ctx.beginPath();
          for (let i = r.start; i <= r.end; i++) {
            const X = (f[i * 3] - X0) * SC,
              Y = (f[i * 3 + 2] - Z0) * SC;
            i === r.start ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
          }
          ctx.strokeStyle = "#4a3520";
          ctx.lineWidth = w + 3;
          ctx.stroke();
          const k = Math.min(1, r.q / 4);
          const hue = counts.length > 1 ? [215, 0, 120][ropeOf[r.start]] : 30;
          ctx.strokeStyle = `hsl(${hue} ${45 + 35 * k}% ${55 + 8 * k}%)`;
          ctx.lineWidth = w;
          ctx.stroke();
        }
        ctx.fillStyle = "#222";
        for (let k = 0, e = -1; k < counts.length; k++) {
          e += counts[k]; // la punta de cada soga
          ctx.beginPath();
          ctx.arc((f[e * 3] - X0) * SC, (f[e * 3 + 2] - Z0) * SC, w / 2 + 1, 0, 7);
          ctx.fill();
        }
        const step = [...steps].reverse().find((st) => st.t <= t + 1e-6);
        document.getElementById("title").textContent = step.title;
        document.getElementById("t").textContent = t.toFixed(1) + " s";
      }
      s.oninput = draw;
      draw();
    </script>
  </body>
</html>
